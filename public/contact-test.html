<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contact form smoke test — portfolio</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#05070f; color:#f3f5fb; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif; }
  .wrap { max-width:38rem; margin:4rem auto; padding:0 1.25rem; }
  h1 { font-weight:300; letter-spacing:-0.03em; }
  form { background:#0a1020; border:1px solid #1b2748; border-radius:0.75rem; padding:1.25rem; }
  label { display:block; font-size:0.8rem; margin:0 0 0.25rem; }
  input, textarea { width:100%; background:#202c50; color:#f3f5fb; border:1px solid #1b2748; border-radius:0.375rem; padding:0.5rem 0.7rem; font:inherit; box-sizing:border-box; }
  textarea { min-height:5rem; resize:vertical; }
  button { margin-top:0.75rem; }
  .note { margin-top:0.5rem; font-size:0.75rem; color:#8f9ab4; word-break:break-word; }
  .ok { color:#a9f2d3; }
  .bad { color:#f3f5fb; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Contact form smoke test</h1>
  <form id="contact-form" novalidate>
    <label for="c-name">Name</label>
    <input id="c-name" name="name" type="text" required />

    <label for="c-email">Email</label>
    <input id="c-email" name="email" type="email" required />

    <label for="c-subject">Subject</label>
    <input id="c-subject" name="subject" type="text" required />

    <label for="c-message">Message</label>
    <textarea id="c-message" name="message" required></textarea>

    <button type="submit">Send Message</button>
    <p class="note" id="c-status" role="status" aria-live="polite"></p>
  </form>
</div>
<script type="module">
  import { init, send, EmailJSResponseStatus } from "./node_modules/@emailjs/browser/esm/index.js";

  const statusEl = document.getElementById("c-status");
  const fields = ["name","email","subject","message"];

  const status = (msg, ok = false) => {
    statusEl.textContent = msg;
    statusEl.className = "note " + (ok ? "ok" : "bad");
  };

  init({
    publicKey: "-XLFJtsee10giO6ec",
  });

  document.getElementById("contact-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    status("sending…");

    const params = Object.fromEntries(
      fields.map((name) => {
        const el = document.getElementById("c-" + name);
        return [name, el ? String(el.value).trim() : ""];
      })
    );

    try {
      const response = await send(
        "service_x8uuxi2",
        "template_l0jhn22",
        params
      );

      if (response.status === EmailJSResponseStatus.SUCCESS) {
        status("sent — check your EmailJS activity log / connected inbox", true);
        document.getElementById("contact-form").reset();
        return;
      }

      const code = response.status;
      status(
        (code === EmailJSResponseStatus.BLOCKED_EMAIL || code === EmailJSResponseStatus.FORBIDDEN)
          ? "rejected by EmailJS — check service, template and the recipient configured in EmailJS"
          : (code === EmailJSResponseStatus.TOO_MANY_REQUESTS)
            ? "EmailJS rate limited this send"
            : (code === EmailJSResponseStatus.UNAVAILABLE_FOR_HEADLESS_BROWSER)
              ? "EmailJS refused this browser session"
              : ("EmailJS returned: " + JSON.stringify(response))
      );
    } catch (err) {
      status("throw: " + (err && err.message ? err.message : String(err)));
    }
  });
</script>
</body>
</html>
