<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" fill="none">
  <!-- Topology plate: a distributed system drawn as an orbital mandala —
       a core, four rings, eight service nodes and two swept arcs. -->

  <!-- Rings -->
  <circle cx="240" cy="240" r="70" stroke="#2b3b68"/>
  <circle cx="240" cy="240" r="130" stroke="#1b2748"/>
  <circle cx="240" cy="240" r="185" stroke="#2b3b68" stroke-dasharray="3 7"/>
  <circle cx="240" cy="240" r="215" stroke="#1b2748"/>

  <!-- Axes -->
  <g stroke="#1b2748" stroke-opacity="0.6">
    <path d="M240 25v430M25 240h430"/>
  </g>

  <!-- Swept arcs -->
  <path d="M332.5 79.8A185 185 0 0 1 400.2 332.5" stroke="#8b5cf6"/>
  <path d="M79.8 332.5A185 185 0 0 1 147.5 79.8" stroke="#22d3ee"/>

  <!-- Chord octagon between service nodes -->
  <path d="M370 240L332 148L240 110L148 148L110 240L148 332L240 370L332 332Z"
        stroke="#1b2748"/>

  <!-- Service nodes -->
  <g>
    <rect x="234" y="104" width="12" height="12" transform="rotate(45 240 110)" fill="#8b5cf6"/>
    <rect x="364" y="234" width="12" height="12" transform="rotate(45 370 240)" stroke="#22d3ee"/>
    <rect x="234" y="364" width="12" height="12" transform="rotate(45 240 370)" stroke="#22d3ee"/>
    <rect x="104" y="234" width="12" height="12" transform="rotate(45 110 240)" fill="#e0b978"/>
    <rect x="326" y="142" width="12" height="12" transform="rotate(45 332 148)" stroke="#2b3b68"/>
    <rect x="142" y="142" width="12" height="12" transform="rotate(45 148 148)" stroke="#2b3b68"/>
    <rect x="142" y="326" width="12" height="12" transform="rotate(45 148 332)" stroke="#2b3b68"/>
    <rect x="326" y="326" width="12" height="12" transform="rotate(45 332 332)" stroke="#2b3b68"/>
  </g>

  <!-- Inner relay points -->
  <g stroke="#6b7ba3">
    <circle cx="301" cy="275" r="4.5"/>
    <circle cx="179" cy="275" r="4.5"/>
    <circle cx="179" cy="205" r="4.5"/>
    <circle cx="301" cy="205" r="4.5"/>
  </g>

  <!-- Core -->
  <rect x="222" y="222" width="36" height="36" rx="6" stroke="#2b3b68"/>
  <circle cx="240" cy="240" r="5" fill="#22d3ee"/>
  <text x="240" y="284" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8"
        letter-spacing="2.5" fill="#6b7ba3">CORE</text>
</svg>
